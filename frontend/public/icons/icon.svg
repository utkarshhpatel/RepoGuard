<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18212B" />
      <stop offset="100%" stop-color="#0B0F14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#1F2937" stroke-width="4" />
  
  <!-- Outer Shield with Glow -->
  <path d="M256 64 L112 128 V248 C112 344 176 432 256 456 C336 432 400 344 400 248 V128 Z" 
        fill="#111821" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <!-- Inner Shield Accent -->
  <path d="M256 96 L136 148 V248 C136 328 188 404 256 424 C324 404 376 328 376 248 V148 Z" 
        fill="#131C26" 
        opacity="0.9" />

  <!-- Checkmark / Code Glyph in Center -->
  <path d="M192 256 L236 300 L320 208" 
        fill="none" 
        stroke="#34D399" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
